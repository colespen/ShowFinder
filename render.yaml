services:
  - type: web
    name: showfinder-server
    runtime: node
    rootDir: server
    # No build step: Node runs the TypeScript sources directly (stable since 24.12),
    # so nothing needs the devDependencies at build time and the platform's
    # production-mode install is correct as-is. `npm ci` keeps it lockfile-exact.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: IQ_TOKEN
        sync: false
      - key: RAPID_KEY
        sync: false
      - key: TICKETMASTER_KEY
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://www.showfinder.ninja
